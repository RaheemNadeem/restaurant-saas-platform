<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickServe – Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        body {
            background: radial-gradient(ellipse at 20% 20%, #e8d5c8 0%, #f0ddd0 25%, #e8cfc0 50%, #ddc4b4 75%, #d4b8a8 100%);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(48deg, transparent 0px, rgba(255, 255, 255, 0.08) 2px, transparent 4px),
                repeating-linear-gradient(138deg, transparent 0px, rgba(200, 160, 130, 0.06) 3px, transparent 6px);
            pointer-events: none;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 font-sans" style="font-family: 'Inter', sans-serif;">
    <div class="w-full max-w-sm">
        <!-- Logo -->
        <div class="flex items-center justify-center gap-2 mb-8">
            <div class="w-9 h-9 bg-primary rounded-lg flex items-center justify-center shadow-sm">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <span class="text-xl font-semibold text-gray-800">QuickServe</span>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-md px-8 py-7">
            <!-- Secure Reset badge -->
            <div class="flex items-center gap-2 bg-green-50 border border-green-200 rounded-lg px-3 py-2 mb-5">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" class="text-green-600 flex-shrink-0"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <span class="text-xs font-medium text-green-700">Secure Reset</span>
            </div>

            <h1 class="text-2xl font-bold text-gray-900 mb-1">Create a new password</h1>
            <p class="text-sm text-gray-500 mb-6">Enter a new password for your QuickServe account.</p>

            <form action="reset-success.html" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">New password</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <input type="password" placeholder="Enter new password"
                            class="w-full pl-9 pr-3 py-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50 text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-200 focus:border-red-400" />
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirm new password</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <input type="password" placeholder="Re-enter new password"
                            class="w-full pl-9 pr-3 py-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50 text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-200 focus:border-red-400" />
                    </div>
                </div>

                <!-- Password requirements -->
                <div class="bg-gray-50 rounded-lg px-4 py-3 border border-gray-100">
                    <p class="text-xs font-medium text-gray-600 mb-1.5">Password must include:</p>
                    <ul class="space-y-1">
                        <li class="flex items-center gap-2 text-xs text-gray-500">
                            <span
                                class="w-4 h-4 rounded-full border border-gray-300 flex items-center justify-center flex-shrink-0 text-xs">✓</span>
                            At least 8 characters
                        </li>
                        <li class="flex items-center gap-2 text-xs text-gray-500">
                            <span
                                class="w-4 h-4 rounded-full border border-gray-300 flex items-center justify-center flex-shrink-0 text-xs">✓</span>
                            1 uppercase letter and 1 number
                        </li>
                        <li class="flex items-center gap-2 text-xs text-gray-500">
                            <span
                                class="w-4 h-4 rounded-full border border-gray-300 flex items-center justify-center flex-shrink-0 text-xs">✓</span>
                            1 special character
                        </li>
                    </ul>
                </div>

                <div class="flex gap-3 pt-1">
                    <button type="submit"
                        class="flex-1 flex items-center justify-center gap-2 py-2.5 bg-primary hover:bg-primary-hover text-white rounded-lg text-sm font-semibold transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        Update Password
                    </button>
                    <a href="owner-login.html"
                        class="flex-1 flex items-center justify-center gap-1.5 py-2.5 border border-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="m15 18-6-6 6-6" />
                        </svg>
                        Cancel and Sign In
                    </a>
                </div>
            </form>
        </div>

        <p class="text-center text-xs text-gray-500 mt-5">
            Once submitted, you'll need to re-login using the new .
        </p>
    </div>
</body>

</html>
