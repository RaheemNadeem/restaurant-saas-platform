<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickServe – Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        body {
            background: radial-gradient(ellipse at 30% 10%, #ddc9bc 0%, #e8d5c5 30%, #f0ded0 60%, #e8d0c0 100%);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                repeating-linear-gradient(52deg, transparent 0px, rgba(255, 255, 255, 0.07) 2px, transparent 5px),
                repeating-linear-gradient(142deg, transparent 0px, rgba(200, 155, 120, 0.05) 4px, transparent 8px);
            pointer-events: none;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 font-sans" style="font-family: 'Inter', sans-serif;">
    <div class="w-full max-w-sm">
        <!-- Logo -->
        <div class="flex items-center justify-center gap-2 mb-6">
            <div class="w-9 h-9 bg-primary rounded-lg flex items-center justify-center shadow-sm">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <span class="text-xl font-semibold text-gray-800">QuickServe</span>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-md px-8 py-7">
            <h1 class="text-2xl font-bold text-gray-900 mb-1">Create your restaurant account</h1>
            <p class="text-sm text-gray-500 mb-6">Set up a ordering platform live in minutes.</p>

            <form action="onboarding-business.html">
                <!-- Owner Name -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Owner Name</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <circle cx="12" cy="8" r="4" />
                                <path d="M20 21a8 8 0 1 0-16 0" />
                            </svg>
                        </span>
                        <input type="text" placeholder="Ayesha Rahman"
                            class="w-full pl-9 pr-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-200 focus:border-red-400 text-gray-700 placeholder-gray-400 bg-gray-50" />
                    </div>
                </div>

                <!-- Restaurant Name -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Restaurant Name</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
                                <path d="M7 2v20" />
                                <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
                            </svg>
                        </span>
                        <input type="text" placeholder="Quick Serve Kitchen"
                            class="w-full pl-9 pr-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-200 focus:border-red-400 text-gray-700 placeholder-gray-400 bg-gray-50" />
                    </div>
                </div>

                <!-- Business Email -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Business Email</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect width="20" height="16" x="2" y="4" rx="2" />
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                            </svg>
                        </span>
                        <input type="email" placeholder="owner@restaurant.com"
                            class="w-full pl-9 pr-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-200 focus:border-red-400 text-gray-700 placeholder-gray-400 bg-gray-50" />
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <input type="password" placeholder="Create a strong password"
                            class="w-full pl-9 pr-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-200 focus:border-red-400 text-gray-700 placeholder-gray-400 bg-gray-50" />
                    </div>
                </div>

                <!-- Create Account Button -->
                <button type="submit"
                    class="w-full py-2.5 bg-primary hover:bg-primary-hover text-white rounded-lg text-sm font-semibold transition-colors duration-150 shadow-sm">
                    Create Account
                </button>
            </form>

            <div class="mt-4 text-center">
                <a href="owner-login.html" class="text-sm text-gray-600 hover:text-gray-800 font-medium">Back to Sign
                    In</a>
            </div>

            <p class="text-center text-xs text-gray-400 mt-4">
                By registering, you agree to our <a href="#" class="underline">Terms and Privacy Policy</a>.
            </p>
        </div>

        <p class="text-center text-xs text-gray-500 mt-4">
            Need help? <a href="#" class="underline hover:text-gray-700">Contact us at support@quickserve.io</a>
        </p>
    </div>
</body>

</html>
