<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickServe – Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        body {
            background: radial-gradient(ellipse at 20% 20%, #e8d5c8 0%, #f0ddd0 25%, #e8cfc0 50%, #ddc4b4 75%, #d4b8a8 100%);
            background-size: cover;
        }

        /* Silk fabric effect */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                repeating-linear-gradient(48deg, transparent 0px, rgba(255, 255, 255, 0.08) 2px, transparent 4px),
                repeating-linear-gradient(138deg, transparent 0px, rgba(200, 160, 130, 0.06) 3px, transparent 6px);
            pointer-events: none;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-sm">
        <!-- Logo -->
        <div class="flex items-center justify-center gap-2 mb-8">
            <div class="w-9 h-9 bg-primary rounded-lg flex items-center justify-center shadow-sm">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <span class="text-xl font-semibold text-gray-800">QuickServe</span>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-md px-8 py-7">
            <h1 class="text-2xl font-bold text-gray-900 mb-1">Welcome back</h1>
            <p class="text-sm text-gray-500 mb-6">Sign in to manage your restaurant easily.</p>

            <form action="onboarding-business.html">
                <!-- Email -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect width="20" height="16" x="2" y="4" rx="2" />
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                            </svg>
                        </span>
                        <input type="email" placeholder="john@myrestaurant.com"
                            class="w-full pl-9 pr-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-200 focus:border-red-400 text-gray-700 placeholder-gray-400 bg-gray-50" />
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <input type="password" placeholder="Enter your password"
                            class="w-full pl-9 pr-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-200 focus:border-red-400 text-gray-700 placeholder-gray-400 bg-gray-50" />
                    </div>
                </div>

                <!-- Remember + Forgot -->
                <div class="flex items-center justify-between mb-5">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox"
                            class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-red-400" />
                        <span class="text-sm text-gray-600">Remember Me</span>
                    </label>
                    <a href="recover-account.html" class="text-sm text-primary hover:text-primary-hover font-medium">Forgot
                        password?</a>
                </div>

                <!-- Sign In Button -->
                <button type="submit"
                    class="w-full py-2.5 bg-primary hover:bg-primary-hover text-white rounded-lg text-sm font-semibold transition-colors duration-150 shadow-sm">
                    Sign In
                </button>
            </form>

            <div class="mt-4 text-center">
                <a href="owner-signup.html" class="text-sm text-gray-600 hover:text-gray-800">
                    <span class="font-medium text-gray-700">Create New Account</span>
                </a>
            </div>
        </div>

        <p class="text-center text-xs text-gray-500 mt-5">
            By continuing, you agree to our
            <a href="#" class="underline hover:text-gray-700">Terms of Service</a> &amp;
            <a href="#" class="underline hover:text-gray-700">Privacy Policy</a>
        </p>
    </div>
</body>

</html>
