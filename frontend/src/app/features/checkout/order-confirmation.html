<div class="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-6 text-center">
    <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-6 text-3xl">
        ✓
    </div>

    <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Order Confirmed!</h1>
    <p class="text-gray-500 mb-8 max-w-sm mx-auto">
        Your order <strong>#{{ orderNumber }}</strong> has been placed and is being prepared by our kitchen.
    </p>

    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 w-full max-w-md mb-8">
        <div class="flex items-center justify-between mb-4">
            <span class="text-sm text-gray-500">Pickup status</span>
            <span class="text-sm font-bold text-green-600">Preparing</span>
        </div>
        <div class="flex items-center justify-between">
            <span class="text-sm text-gray-500">Estimated wait</span>
            <span class="text-sm font-bold text-gray-900">{{ estimatedWait }} mins</span>
        </div>
    </div>

    <div class="flex flex-col gap-3 w-full max-w-xs">
        <a routerLink="/merchant/order-manager"
            class="bg-[#BF4444] hover:bg-[#a33a3a] text-white font-semibold py-3 rounded-xl transition-colors">
            Track Live Status
        </a>
        <a routerLink="/" class="text-gray-500 hover:text-gray-700 font-medium py-2">
            Back to Home
        </a>
    </div>
</div>
