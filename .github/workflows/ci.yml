name: QuickServe CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore backend/QuickServe.API/QuickServe.API.csproj
    - name: Build
      run: dotnet build backend/QuickServe.API/QuickServe.API.csproj --no-restore
    - name: Test
      run: dotnet test backend/QuickServe.API/QuickServe.API.csproj --no-build --verbosity normal

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Build Angular Output
      working-directory: ./frontend
      run: npm run build
